<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="85%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#252b3d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d2232" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="route-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f5bea" />
      <stop offset="100%" stop-color="#4aa3ff" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2f5bea" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#1d2232" />
  <rect width="512" height="512" rx="116" fill="url(#bg-glow)" />
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="98"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="3"
  />
  <!-- Stylized Route Path -->
  <path
    d="M138 368 C 138 286, 256 306, 256 236 C 256 172, 344 176, 366 134"
    fill="none"
    stroke="url(#route-grad)"
    stroke-width="44"
    stroke-linecap="round"
    filter="url(#soft-glow)"
  />
  <path
    d="M138 368 C 138 286, 256 306, 256 236 C 256 172, 344 176, 366 134"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.28"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="16 20"
  />
  <!-- Start Node (Emerald) -->
  <circle cx="138" cy="368" r="30" fill="#1d2232" />
  <circle cx="138" cy="368" r="18" fill="#4ade9a" />
  <!-- Destination Arrowhead -->
  <path
    d="M388 102 L 382 184 L 352 154 L 310 144 Z"
    fill="#ffffff"
    filter="url(#soft-glow)"
  />
